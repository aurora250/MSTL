name: "Save vcpkg cache"
description: >-
  Save the caches setup-vcpkg restored, once the build has populated them. Only the default branch
  writes entries: caches written by a pull request are invisible to every other run, yet they count
  against the same repository cache quota, so writing them evicts the entries the default branch
  depends on.

inputs:
  cache-key:
    description: "cache-key reported by setup-vcpkg"
    required: true
  cache-hit:
    description: "cache-hit reported by setup-vcpkg; an exact hit needs no save"
    required: false
    default: "false"
  binary-cache:
    description: "binary-cache reported by setup-vcpkg, so the cached path has a single definition"
    required: true
  tool-cache-key:
    description: "tool-cache-key reported by setup-vcpkg"
    required: true
  tool-cache-hit:
    description: "tool-cache-hit reported by setup-vcpkg"
    required: false
    default: "false"
  vcpkg-tool-cache-path:
    description: "vcpkg-tool-cache-path reported by setup-vcpkg"
    required: true
  enabled:
    description: "Whether this run may write a cache entry"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Decide what may be saved
      id: gate
      shell: bash
      env:
        CACHE_HIT: ${{ inputs.cache-hit }}
        TOOL_CACHE_HIT: ${{ inputs.tool-cache-hit }}
        ENABLED: ${{ inputs.enabled }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CACHE_KEY: ${{ inputs.cache-key }}
        TOOL_CACHE_KEY: ${{ inputs.tool-cache-key }}
        TOOL_CACHE_PATH: ${{ inputs.vcpkg-tool-cache-path }}
      run: |
        set -euo pipefail

        if [ "$ENABLED" != "true" ]; then
          echo "archives=false" >> "$GITHUB_OUTPUT"
          echo "tool=false" >> "$GITHUB_OUTPUT"
          echo "cache save disabled for this run"
          exit 0
        fi

        if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
          echo "archives=false" >> "$GITHUB_OUTPUT"
          echo "tool=false" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF is not the default branch, restore-only run"
          exit 0
        fi

        if [ "$CACHE_HIT" = "true" ]; then
          echo "archives=false" >> "$GITHUB_OUTPUT"
          echo "exact archive cache hit for $GITHUB_REF, nothing to save"
        else
          echo "archives=true" >> "$GITHUB_OUTPUT"
          echo "saving archive cache key: $CACHE_KEY"
        fi

        # The tool tree key does not depend on the manifest, so once it exists every later run
        # restores it and there is nothing to upload.
        if [ "$TOOL_CACHE_HIT" = "true" ]; then
          echo "tool=false" >> "$GITHUB_OUTPUT"
          echo "tool tree restored, nothing to save"
        else
          echo "tool=true" >> "$GITHUB_OUTPUT"
          echo "saving tool tree cache key: $TOOL_CACHE_KEY (path: $TOOL_CACHE_PATH)"
        fi

    - name: Save vcpkg binary cache
      if: steps.gate.outputs.archives == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.binary-cache }}
        key: ${{ inputs.cache-key }}

    - name: Save vcpkg tool tree
      if: steps.gate.outputs.tool == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.vcpkg-tool-cache-path }}
        key: ${{ inputs.tool-cache-key }}
